version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: reachinbox
      POSTGRES_DB: reachinbox
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    restart: always
    # AOF persistence so BullMQ jobs survive a container/host restart, not just process restart
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports: ["9200:9200"]
    volumes: ["esdata:/usr/share/elasticsearch/data"]

  # Optional full-stack mode:  docker compose --profile app up --build
  api:
    profiles: ["app"]
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://reachinbox:reachinbox@postgres:5432/reachinbox
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
    command: sh -c "npx prisma db push && node dist/index.js"
    ports: ["4000:4000"]
    depends_on: [postgres, redis, elasticsearch]

  worker:
    profiles: ["app"]
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://reachinbox:reachinbox@postgres:5432/reachinbox
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
    command: node dist/queue/worker.js
    depends_on: [postgres, redis, api]

volumes:
  pgdata:
  redisdata:
  esdata:
